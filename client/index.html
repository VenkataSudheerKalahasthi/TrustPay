<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <script>
      try {
        const theme = localStorage.getItem('trustpay-theme');
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
        } else if (theme === 'light') {
          document.documentElement.classList.remove('dark');
        }
      } catch (e) {}
    </script>

    <!-- SEO -->
    <title>TrustPay – Secure Digital Contract & Escrow Platform</title>
    <meta
      name="description"
      content="TrustPay is a secure digital contract and escrow platform for freelancers and clients. Create legally binding contracts, manage milestone payments, and resolve disputes — all in one place."
    />
    <meta name="keywords" content="freelance contracts, escrow platform, digital contracts, secure payments, India freelance, milestone payments" />
    <meta name="author" content="TrustPay" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="TrustPay – Secure Digital Contract & Escrow Platform" />
    <meta property="og:description" content="Protect every transaction with smart contracts and secure escrow." />
    <meta property="og:url" content="https://trustpay.com" />
    <meta property="og:site_name" content="TrustPay" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="TrustPay – Secure Digital Contract & Escrow Platform" />
    <meta name="twitter:description" content="Protect every transaction with smart contracts and secure escrow." />

    <!-- Theme -->
    <meta name="theme-color" content="#0f172a" />
    <meta name="color-scheme" content="dark light" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Preconnect for Google Fonts performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
